<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Trivia Challenge | Eli B Hall</title>
  <meta name="description" content="Interactive finance trivia web app with scoring and replay." />
  <style>
    :root {
      --primary: #12355b;
      --primary-dark: #0d2844;
      --accent: #1f7a8c;
      --correct: #166534;
      --wrong: #991b1b;
      --bg: #f4f8fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #52606d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, #eaf2fb 0%, #f9fcff 48%, #edf5ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .app-shell {
      width: 100%;
      max-width: 860px;
      background: var(--card);
      border: 1px solid #d8e4f0;
      border-radius: 16px;
      box-shadow: 0 16px 32px rgba(18, 53, 91, 0.15);
      overflow: hidden;
    }

    .mini-nav {
      background: #0e2d4d;
      padding: 0.7rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .mini-nav a {
      color: #d9e8f8;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.94rem;
    }

    .mini-nav a:hover,
    .mini-nav a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .app-header {
      background: var(--primary);
      color: #ffffff;
      padding: 1.2rem 1.2rem 1rem;
    }

    .app-header h1 {
      margin: 0;
      font-size: clamp(1.4rem, 3.4vw, 2rem);
    }

    .app-header p {
      margin: 0.4rem 0 0;
      color: #d9e6f5;
    }

    .app-body {
      padding: 1.2rem;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      color: var(--muted);
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 11px;
      border-radius: 999px;
      background: #e5edf6;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #3ea0b6);
      transition: width 0.3s ease;
    }

    .question {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0 0 0.9rem;
      color: var(--primary-dark);
    }

    .answers {
      display: grid;
      gap: 0.65rem;
    }

    .answer-btn {
      border: 1px solid #bfd1e4;
      background: #f8fbff;
      color: #16324f;
      text-align: left;
      border-radius: 10px;
      padding: 0.78rem 0.85rem;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .answer-btn:hover,
    .answer-btn:focus-visible {
      border-color: var(--primary);
      background-color: #edf5ff;
      transform: translateY(-1px);
      outline: none;
    }

    .answer-btn:disabled {
      cursor: not-allowed;
      opacity: 0.9;
      transform: none;
    }

    .answer-btn.correct {
      border-color: #4bb56f;
      background: #e7f8ec;
      color: var(--correct);
      font-weight: 700;
    }

    .answer-btn.wrong {
      border-color: #dd8080;
      background: #fdecec;
      color: var(--wrong);
      font-weight: 700;
    }

    .feedback {
      margin-top: 1rem;
      min-height: 2rem;
      font-weight: 700;
    }

    .feedback.correct {
      color: var(--correct);
    }

    .feedback.wrong {
      color: var(--wrong);
    }

    .controls {
      margin-top: 1.1rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .control-btn {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 0.58rem 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .control-btn.secondary {
      background: #fff;
      color: var(--primary);
    }

    .control-btn:hover,
    .control-btn:focus-visible {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      color: #fff;
      outline: none;
    }

    .control-btn.secondary:hover,
    .control-btn.secondary:focus-visible {
      background: #eef4fb;
      color: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .hidden {
      display: none;
    }

    .return-link {
      margin-top: 1.2rem;
      display: inline-block;
      color: var(--primary);
      font-weight: 700;
    }

    @media (max-width: 620px) {
      .app-header,
      .app-body {
        padding: 1rem;
      }

      .question {
        font-size: 1.08rem;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell" aria-live="polite">
    <nav class="mini-nav" aria-label="Website">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="resume.html">Resume</a>
      <a href="scratch.html">Scratch Page</a>
      <a href="app.html">Finance App</a>
    </nav>

    <header class="app-header">
      <h1>Finance Trivia Challenge</h1>
      <p>Test your finance fundamentals and build your score.</p>
    </header>

    <section class="app-body">
      <div class="status-row">
        <div id="questionCount">Question 1 of 10</div>
        <div id="scoreCount">Score: 0</div>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <h2 class="question" id="questionText">Loading question...</h2>
      <div class="answers" id="answersContainer"></div>

      <p class="feedback" id="feedbackText"></p>

      <div class="controls">
        <button class="control-btn hidden" id="nextBtn" type="button">Next Question</button>
        <button class="control-btn hidden" id="playAgainBtn" type="button">Play Again</button>
        <button class="control-btn secondary" id="resetBtn" type="button">Reset Quiz</button>
      </div>

      <a class="return-link" href="scratch.html">&larr; Back to Scratch Page</a>
    </section>
  </main>

  <script>
    const quizData = [
      {
        question: "What does ROI stand for?",
        options: [
          "Return on Investment",
          "Rate of Income",
          "Revenue over Interest",
          "Return on Inventory"
        ],
        answer: 0,
        explanation: "Correct. ROI measures the gain or loss relative to investment cost."
      },
      {
        question: "If inflation rises and your salary stays the same, your purchasing power usually...",
        options: [
          "Increases",
          "Stays the same",
          "Decreases",
          "Becomes unpredictable"
        ],
        answer: 2,
        explanation: "Correct. Higher inflation erodes what each dollar can buy."
      },
      {
        question: "Which statement best describes diversification?",
        options: [
          "Putting all funds in one high-performing stock",
          "Spreading investments across different assets",
          "Only buying bonds",
          "Selling all investments during volatility"
        ],
        answer: 1,
        explanation: "Correct. Diversification helps reduce risk concentration."
      },
      {
        question: "A higher credit score usually helps you...",
        options: [
          "Pay higher loan interest rates",
          "Borrow with better terms and lower rates",
          "Avoid paying taxes",
          "Eliminate all financial risk"
        ],
        answer: 1,
        explanation: "Correct. Strong credit often improves borrowing options and rates."
      },
      {
        question: "What is the primary purpose of a budget?",
        options: [
          "To avoid ever spending money",
          "To track and plan income and expenses",
          "To guarantee investment profits",
          "To replace a savings account"
        ],
        answer: 1,
        explanation: "Correct. A budget gives control and visibility over your money."
      },
      {
        question: "In time value of money, a dollar today is worth more than a dollar tomorrow because...",
        options: [
          "Money can be invested to earn returns",
          "Banks do not allow future withdrawals",
          "Inflation never changes",
          "Tomorrow's dollar is guaranteed to be larger"
        ],
        answer: 0,
        explanation: "Correct. Money today has earning potential over time."
      },
      {
        question: "Which of the following is typically considered a fixed expense?",
        options: [
          "Monthly rent",
          "Dining out",
          "Entertainment",
          "Vacation travel"
        ],
        answer: 0,
        explanation: "Correct. Rent usually stays constant month to month."
      },
      {
        question: "What is a common benefit of starting to invest early?",
        options: [
          "You avoid all market risk",
          "Compounding has more time to work",
          "You can ignore diversification",
          "You pay no fees forever"
        ],
        answer: 1,
        explanation: "Correct. The longer timeline amplifies compounding effects."
      },
      {
        question: "Gross profit equals revenue minus...",
        options: [
          "Operating expenses",
          "Taxes",
          "Cost of goods sold",
          "Interest payments"
        ],
        answer: 2,
        explanation: "Correct. Gross profit focuses on revenue after direct production/service costs."
      },
      {
        question: "A financially disciplined habit that supports long-term goals is...",
        options: [
          "Impulse buying with each paycheck",
          "Saving first, then spending intentionally",
          "Ignoring account statements",
          "Using debt for every purchase"
        ],
        answer: 1,
        explanation: "Correct. Paying yourself first strengthens consistency and resilience."
      }
    ];

    const questionCountEl = document.getElementById('questionCount');
    const scoreCountEl = document.getElementById('scoreCount');
    const progressFillEl = document.getElementById('progressFill');
    const questionTextEl = document.getElementById('questionText');
    const answersContainerEl = document.getElementById('answersContainer');
    const feedbackTextEl = document.getElementById('feedbackText');
    const nextBtn = document.getElementById('nextBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const resetBtn = document.getElementById('resetBtn');

    let currentQuestionIndex = 0;
    let score = 0;
    let questionLocked = false;

    function renderQuestion() {
      const current = quizData[currentQuestionIndex];
      questionLocked = false;

      questionCountEl.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
      scoreCountEl.textContent = `Score: ${score}`;
      questionTextEl.textContent = current.question;
      feedbackTextEl.textContent = '';
      feedbackTextEl.className = 'feedback';
      nextBtn.classList.add('hidden');
      playAgainBtn.classList.add('hidden');

      const progressPercent = (currentQuestionIndex / quizData.length) * 100;
      progressFillEl.style.width = `${progressPercent}%`;

      answersContainerEl.innerHTML = '';

      current.options.forEach((optionText, optionIndex) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'answer-btn';
        btn.textContent = optionText;
        btn.setAttribute('aria-label', `Answer option: ${optionText}`);

        btn.addEventListener('click', () => selectAnswer(optionIndex, btn));

        answersContainerEl.appendChild(btn);
      });
    }

    function selectAnswer(selectedIndex, clickedButton) {
      if (questionLocked) {
        return;
      }

      questionLocked = true;
      const current = quizData[currentQuestionIndex];
      const buttons = answersContainerEl.querySelectorAll('.answer-btn');

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === current.answer) {
          button.classList.add('correct');
        }
      });

      if (selectedIndex === current.answer) {
        score += 1;
        scoreCountEl.textContent = `Score: ${score}`;
        feedbackTextEl.textContent = current.explanation;
        feedbackTextEl.className = 'feedback correct';
      } else {
        clickedButton.classList.add('wrong');
        feedbackTextEl.textContent = `Not quite. ${current.explanation}`;
        feedbackTextEl.className = 'feedback wrong';
      }

      if (currentQuestionIndex < quizData.length - 1) {
        nextBtn.classList.remove('hidden');
        nextBtn.focus();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const percentage = Math.round((score / quizData.length) * 100);
      progressFillEl.style.width = '100%';

      let performanceMessage = '';
      if (percentage >= 90) {
        performanceMessage = 'Outstanding work. You demonstrated elite finance fundamentals.';
      } else if (percentage >= 70) {
        performanceMessage = 'Great job. You have a strong finance foundation and good decision instincts.';
      } else {
        performanceMessage = 'Solid effort. Review the concepts and run it back to improve your score.';
      }

      feedbackTextEl.textContent = `Final Score: ${score}/${quizData.length} (${percentage}%). ${performanceMessage}`;
      feedbackTextEl.className = 'feedback correct';
      playAgainBtn.classList.remove('hidden');
      playAgainBtn.focus();
      questionCountEl.textContent = 'Quiz Complete';
      questionTextEl.textContent = 'Challenge finished. Ready for another round?';
    }

    function nextQuestion() {
      currentQuestionIndex += 1;
      renderQuestion();
    }

    function resetQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      renderQuestion();
    }

    nextBtn.addEventListener('click', nextQuestion);
    playAgainBtn.addEventListener('click', resetQuiz);
    resetBtn.addEventListener('click', resetQuiz);

    renderQuestion();
  </script>
</body>
</html>
